<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#27ae60" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Primary Meta Tags for SEO -->
    <title>FreshBasket | Grocery Store Management System</title>
    <meta name="description" content="Modern grocery store management system with inventory, sales, customer management, and analytics." />
    <meta name="keywords" content="grocery, management, inventory, sales, dashboard, admin" />
    <meta name="author" content="FreshBasket" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://freshbasket.example.com/" />
    <meta property="og:title" content="FreshBasket | Grocery Store Management System" />
    <meta property="og:description" content="Modern grocery store management system with inventory, sales, customer management, and analytics." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://freshbasket.example.com/" />
    <meta property="twitter:title" content="FreshBasket | Grocery Store Management System" />
    <meta property="twitter:description" content="Modern grocery store management system with inventory, sales, customer management, and analytics." />
    <meta property="twitter:image" content="%PUBLIC_URL%/og-image.png" />
    
    <!-- External Dependencies -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    
    <!-- Preload critical fonts (optional - add if using custom fonts) -->
    <!-- <link rel="preload" href="%PUBLIC_URL%/fonts/custom-font.woff2" as="font" type="font/woff2" crossorigin> -->
    
    <!-- Critical CSS (optional - for above-the-fold styles) -->
    <style>
      /* Critical CSS for initial load */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        overflow-x: hidden;
        min-height: 100vh;
      }
      
      /* Loading animation */
      #root {
        min-height: 100vh;
      }
      
      /* Initial loader */
      .app-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #27ae60 0%, #219653 100%);
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    
    <!-- Google Fonts (optional - add if needed) -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"> -->
  </head>
  
  <body>
    <!-- No Script Fallback -->
    <noscript>
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #27ae60;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
        z-index: 9999;
      ">
        <h1 style="font-size: 2.5rem; margin-bottom: 20px;">
          <i class="fas fa-exclamation-triangle" style="margin-right: 10px;"></i>
          JavaScript Required
        </h1>
        <p style="font-size: 1.2rem; max-width: 600px; margin-bottom: 30px;">
          FreshBasket requires JavaScript to run properly. Please enable JavaScript in your browser settings to continue.
        </p>
        <div style="background: white; color: #27ae60; padding: 15px 30px; border-radius: 8px; font-weight: bold;">
          <i class="fas fa-cog" style="margin-right: 8px;"></i>
          Enable JavaScript
        </div>
      </div>
    </noscript>
    
    <!-- Root element for React -->
    <div id="root">
      <!-- Loading state shown while React app loads -->
      <div class="app-loading">
        <div class="loading-spinner"></div>
      </div>
    </div>
    
    <!-- Service Worker Registration (for PWA) -->
    <script>
      // Register service worker for PWA capabilities
      if ('serviceWorker' in navigator && process.env.NODE_ENV === 'production') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%PUBLIC_URL%/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful:', registration.scope);
            })
            .catch(error => {
              console.log('ServiceWorker registration failed:', error);
            });
        });
      }
      
      // Remove loading spinner once app is loaded
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingEl = document.querySelector('.app-loading');
          if (loadingEl) {
            loadingEl.style.opacity = '0';
            loadingEl.style.transition = 'opacity 0.3s ease';
            setTimeout(() => loadingEl.remove(), 300);
          }
        }, 100);
      });
      
      // Theme detection (optional)
      const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
      const storedTheme = localStorage.getItem('theme');
      
      if (storedTheme === 'dark' || (!storedTheme && prefersDarkScheme.matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </body>
</html>
